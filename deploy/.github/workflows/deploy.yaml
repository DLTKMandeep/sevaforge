###############################################################################
# SevaForge CI/CD Pipeline - GitHub Actions
#
# Triggers:
#   push to main     -> test, build, terraform, deploy to production
#   push to staging  -> test, build, terraform, deploy to staging
#   pull_request     -> test + build only (no deploy)
#
# Auth: Workload Identity Federation (no service-account keys)
###############################################################################

name: SevaForge CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# ---------------------------------------------------------------------------
# Concurrency: one deploy per branch at a time; queued runs cancel stale ones
# ---------------------------------------------------------------------------
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Shared environment variables
# ---------------------------------------------------------------------------
env:
  REGISTRY: us-central1-docker.pkg.dev/sevaforge-prod/sevaforge
  GKE_CLUSTER: sevaforge-cluster
  GKE_ZONE: us-central1-a
  PROJECT_ID: sevaforge-prod
  WORKLOAD_IDENTITY_PROVIDER: projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions@sevaforge-prod.iam.gserviceaccount.com
  TERRAFORM_DIR: deploy/terraform
  K8S_DIR: deploy/k8s
  IMAGES: dashboard api auth worker webhook

permissions:
  contents: read
  id-token: write          # required for Workload Identity Federation
  pull-requests: read

# ===========================================================================
# JOBS
# ===========================================================================

jobs:

  # -------------------------------------------------------------------------
  # 1. TEST - lint, type-check, unit tests
  # -------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Type check with mypy
        run: mypy --strict src/

      - name: Run tests with pytest
        run: pytest tests/ -v --tb=short --junitxml=reports/junit.xml --cov=src --cov-report=xml:reports/coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/

  # -------------------------------------------------------------------------
  # 2. BUILD - build & push Docker images to Artifact Registry
  # -------------------------------------------------------------------------
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        image: [dashboard, api, auth, worker, webhook]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            GIT_SHA=${{ github.sha }}

  # -------------------------------------------------------------------------
  # 3. TERRAFORM - plan (always) + apply (main/staging push only)
  # -------------------------------------------------------------------------
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Terraform Init
        run: terraform init -backend-config="prefix=${{ github.ref_name }}"

      - name: Select workspace
        run: terraform workspace select ${{ github.ref_name }} || terraform workspace new ${{ github.ref_name }}

      - name: Terraform Plan
        run: terraform plan -var="image_tag=${{ github.sha }}" -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # -------------------------------------------------------------------------
  # 4. DEPLOY STAGING - kubectl apply to staging namespace
  # -------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, terraform]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set image tags in manifests
        run: |
          for svc in ${{ env.IMAGES }}; do
            sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ github.sha }}|g" ${{ env.K8S_DIR }}/${svc}-deployment.yaml
            sed -i "s|REGISTRY_PLACEHOLDER|${{ env.REGISTRY }}|g" ${{ env.K8S_DIR }}/${svc}-deployment.yaml
          done

      - name: Apply Kubernetes manifests (staging)
        run: kubectl apply -f ${{ env.K8S_DIR }}/ -n staging

      - name: Wait for rollouts
        run: |
          for svc in ${{ env.IMAGES }}; do
            echo "--- waiting for ${svc} rollout ---"
            kubectl rollout status deployment/${svc} -n staging --timeout=300s
          done

      - name: Notify Slack (success)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"SevaForge *staging* deploy succeeded :white_check_mark:\nCommit: \`${GITHUB_SHA::8}\`\nActor: ${GITHUB_ACTOR}\"}"

      - name: Notify Slack (failure)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"SevaForge *staging* deploy FAILED :x:\nCommit: \`${GITHUB_SHA::8}\`\nActor: ${GITHUB_ACTOR}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

  # -------------------------------------------------------------------------
  # 5. DEPLOY PRODUCTION - manual approval, kubectl apply, smoke tests
  # -------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, terraform]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    environment:
      name: production        # requires manual approval configured in repo settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set image tags in manifests
        run: |
          for svc in ${{ env.IMAGES }}; do
            sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ github.sha }}|g" ${{ env.K8S_DIR }}/${svc}-deployment.yaml
            sed -i "s|REGISTRY_PLACEHOLDER|${{ env.REGISTRY }}|g" ${{ env.K8S_DIR }}/${svc}-deployment.yaml
          done

      - name: Apply Kubernetes manifests (production)
        run: kubectl apply -f ${{ env.K8S_DIR }}/ -n sevaforge

      - name: Wait for rollouts
        run: |
          for svc in ${{ env.IMAGES }}; do
            echo "--- waiting for ${svc} rollout ---"
            kubectl rollout status deployment/${svc} -n sevaforge --timeout=300s
          done

      - name: Notify Slack (success)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"SevaForge *production* deploy succeeded :rocket:\nCommit: \`${GITHUB_SHA::8}\`\nActor: ${GITHUB_ACTOR}\"}"

      - name: Notify Slack (failure)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"SevaForge *production* deploy FAILED :rotating_light:\nCommit: \`${GITHUB_SHA::8}\`\nActor: ${GITHUB_ACTOR}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

  # -------------------------------------------------------------------------
  # 6. SMOKE TEST - post-deploy verification
  # -------------------------------------------------------------------------
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 5

    steps:
      - name: Wait for ingress propagation
        run: sleep 15

      - name: Health check - /healthz
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 5 --retry-delay 5 --retry-all-errors \
            https://api.sevaforge.dev/healthz)
          echo "Health check returned HTTP ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Health check failed with status ${HTTP_STATUS}"
            exit 1
          fi

      - name: API status check - /api/status
        run: |
          RESPONSE=$(curl -sf --retry 3 --retry-delay 5 --retry-all-errors \
            https://api.sevaforge.dev/api/status)
          echo "API status response: ${RESPONSE}"
          echo "$RESPONSE" | jq -e '.status == "ok"' > /dev/null 2>&1 || {
            echo "::error::API status check did not return status=ok"
            exit 1
          }

      - name: Notify Slack (smoke tests passed)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"SevaForge production smoke tests passed :white_check_mark:\nAll endpoints healthy.\"}"

      - name: Notify Slack (smoke tests failed)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"SevaForge production smoke tests FAILED :x:\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
