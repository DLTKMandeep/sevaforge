// ── API Layer ──────────────────────────────────────────────────────────
const API = 'http://localhost:8000/api/v1';

async function fetchAPI(path, options = {}) {
  try {
    const res = await fetch(`${API}${path}`, {
      headers: { 'Content-Type': 'application/json', ...options.headers },
      ...options,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (e) {
    console.error(`API error: ${path}`, e);
    return null;
  }
}

// ── Utility Helpers ────────────────────────────────────────────────────
function fmtTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function fmtCurrency(v) { return `$${Number(v).toFixed(2)}`; }
function pct(v) { return `${(Number(v) * 100).toFixed(1)}%`; }

// ── Shared Components ──────────────────────────────────────────────────
function Spinner() {
  return <div className="flex justify-center items-center py-12"><div className="spinner"></div></div>;
}

function StatCard({ icon, label, value, sub, color = 'blue' }) {
  const colors = { blue: 'bg-blue-50 text-blue-600', emerald: 'bg-emerald-50 text-emerald-600', amber: 'bg-amber-50 text-amber-600', red: 'bg-red-50 text-red-600', purple: 'bg-purple-50 text-purple-600', slate: 'bg-slate-50 text-slate-600' };
  return (
    <div className="bg-white rounded-xl border border-slate-200 p-5 card-hover">
      <div className="flex items-start justify-between">
        <div>
          <p className="text-xs font-medium text-slate-500 uppercase tracking-wider">{label}</p>
          <p className="text-2xl font-bold text-slate-900 mt-1">{value}</p>
          {sub && <p className="text-xs text-slate-400 mt-1">{sub}</p>}
        </div>
        <div className={`w-10 h-10 rounded-lg flex items-center justify-center ${colors[color] || colors.blue}`}>
          <i className={`ti ${icon} text-lg`}></i>
        </div>
      </div>
    </div>
  );
}

function StatusBadge({ status }) {
  const map = {
    idle: 'bg-slate-100 text-slate-600',
    running: 'bg-emerald-100 text-emerald-700',
    active: 'bg-emerald-100 text-emerald-700',
    operational: 'bg-emerald-100 text-emerald-700',
    online: 'bg-emerald-100 text-emerald-700',
    connected: 'bg-emerald-100 text-emerald-700',
    success: 'bg-emerald-100 text-emerald-700',
    healthy: 'bg-emerald-100 text-emerald-700',
    error: 'bg-red-100 text-red-700',
    disconnected: 'bg-red-100 text-red-700',
    warning: 'bg-amber-100 text-amber-700',
    paused: 'bg-amber-100 text-amber-700',
    maintenance: 'bg-amber-100 text-amber-700',
    offline: 'bg-slate-200 text-slate-500',
  };
  return (
    <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${map[status] || 'bg-slate-100 text-slate-600'}`}>
      <span className={`w-1.5 h-1.5 rounded-full mr-1.5 ${status === 'running' || status === 'active' || status === 'online' || status === 'connected' || status === 'operational' || status === 'healthy' ? 'bg-emerald-500 pulse-dot' : status === 'error' || status === 'disconnected' ? 'bg-red-500' : status === 'warning' || status === 'paused' || status === 'maintenance' ? 'bg-amber-500' : 'bg-slate-400'}`}></span>
      {status}
    </span>
  );
}

function SectionTitle({ icon, title, subtitle }) {
  return (
    <div className="mb-6">
      <h2 className="text-lg font-semibold text-slate-900 flex items-center gap-2">
        {icon && <i className={`ti ${icon} text-blue-600`}></i>}
        {title}
      </h2>
      {subtitle && <p className="text-sm text-slate-500 mt-0.5">{subtitle}</p>}
    </div>
  );
}

function EmptyState({ icon, message }) {
  return (
    <div className="text-center py-12 text-slate-400">
      <i className={`ti ${icon} text-4xl mb-2 block`}></i>
      <p className="text-sm">{message}</p>
    </div>
  );
}

// 1. Overview Dashboard
function OverviewPage() {
  const [health, setHealth] = useState(null);
  const [finops, setFinops] = useState(null);
  const [auditStats, setAuditStats] = useState(null);
  const [loading, setLoading] = useState(true);
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(() => {
    async function load() {
      const [h, f, a] = await Promise.all([
        fetchAPI('/health'),
        fetchAPI('/finops/stats'),
        fetchAPI('/trust/audit/stats'),
      ]);
      setHealth(h || MOCK.health);
      setFinops(f || MOCK.finopsStats);
      setAuditStats(a || MOCK.auditStats);
      setLoading(false);
    }
    load();
  }, []);

  useEffect(() => {
    if (loading || !chartRef.current) return;
    if (chartInstance.current) chartInstance.current.destroy();
    const ctx = chartRef.current.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, 200);
    gradient.addColorStop(0, 'rgba(37,99,235,0.15)');
    gradient.addColorStop(1, 'rgba(37,99,235,0)');
    chartInstance.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: MOCK.costTrend.map(d => d.date.slice(5)),
        datasets: [{
          label: 'Daily Cost ($)',
          data: MOCK.costTrend.map(d => d.cost),
          borderColor: '#2563eb',
          backgroundColor: gradient,
          borderWidth: 2.5,
          fill: true,
          tension: 0.4,
          pointBackgroundColor: '#2563eb',
          pointRadius: 4,
          pointHoverRadius: 6,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 11 } } },
          y: { grid: { color: '#f1f5f9' }, ticks: { color: '#94a3b8', font: { size: 11 }, callback: v => '$' + v } }
        }
      }
    });
    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, [loading]);

  if (loading) return <Spinner />;

  const hp = health || MOCK.health;
  const fp = finops || MOCK.finopsStats;
  const as = auditStats || MOCK.auditStats;

  return (
    <div className="fade-in space-y-6">
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard icon="ti-api" label="Total Endpoints" value="126" sub="Across 8 modules" color="blue" />
        <StatCard icon="ti-checks" label="Tests Passing" value="284" sub="98.2% pass rate" color="emerald" />
        <StatCard icon="ti-users" label="Active Sessions" value={MOCK.contextStats.active_sessions} sub={`${MOCK.contextStats.total_turns.toLocaleString()} total turns`} color="purple" />
        <StatCard icon="ti-currency-dollar" label="Total Cost (30d)" value={fmtCurrency(fp.total_cost)} sub={`${fp.total_requests.toLocaleString()} requests`} color="amber" />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div className="bg-white rounded-xl border border-slate-200 p-5">
          <h3 className="text-sm font-semibold text-slate-900 mb-4 flex items-center gap-2">
            <i className="ti ti-heartbeat text-red-500"></i> System Health
          </h3>
          <div className="space-y-3">
            {Object.entries(hp.layers || {}).map(([layer, status]) => (
              <div key={layer} className="flex items-center justify-between">
                <span className="text-sm text-slate-600 capitalize">{layer.replace(/_/g, ' ')}</span>
                <StatusBadge status={status} />
              </div>
            ))}
          </div>
        </div>

        <div className="bg-white rounded-xl border border-slate-200 p-5 lg:col-span-2">
          <h3 className="text-sm font-semibold text-slate-900 mb-4 flex items-center gap-2">
            <i className="ti ti-chart-line text-blue-500"></i> Cost Trend (7 days)
          </h3>
          <div style={{ height: '200px' }}>
            <canvas ref={chartRef}></canvas>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-white rounded-xl border border-slate-200 p-5">
          <h3 className="text-sm font-semibold text-slate-900 mb-4 flex items-center gap-2">
            <i className="ti ti-activity text-blue-500"></i> Recent Activity
          </h3>
          <div className="space-y-3">
            {MOCK.recentActivity.map((a, i) => (
              <div key={i} className="flex items-start gap-3">
                <i className={`ti ${a.icon} mt-0.5 ${a.color}`}></i>
                <div className="flex-1 min-w-0">
                  <p className="text-sm text-slate-700 truncate">{a.text}</p>
                  <p className="text-xs text-slate-400">{a.time}</p>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="bg-white rounded-xl border border-slate-200 p-5">
          <h3 className="text-sm font-semibold text-slate-900 mb-4 flex items-center gap-2">
            <i className="ti ti-report-analytics text-purple-500"></i> Platform Summary
          </h3>

            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

  const [testing, setTesting] = useState(false);

  useEffect(() => {
    async function load() {
      const [i, c, t] = await Promise.all([
        fetchAPI('/gateway/info'),
        fetchAPI('/gateway/cache/stats'),
        fetchAPI('/gateway/templates'),
      ]);
      setInfo(i || MOCK.gatewayInfo);
      setCache(c || MOCK.cacheStats);

      setLoading(false);
    }

    setTesting(true);
    const start = Date.now();

        <div className="bg-white rounded-xl border border-slate-200 p-5">

          <div className="space-y-3">

function TrustPage() {
  const [stats, setStats] = useState(null);
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [scanText, setScanText] = useState('');
  const [scanResult, setScanResult] = useState(null);
  const [scanning, setScanning] = useState(false);

  useEffect(() => {
    async function load() {
      const [s, e, gs] = await Promise.all([
        fetchAPI('/trust/audit/stats'),
        fetchAPI('/trust/audit/query'),
        fetchAPI('/trust/guardrails/stats'),
      ]);
      setStats(gs || MOCK.guardrailStats);
      setEntries(e && Array.isArray(e) ? e : MOCK.auditEntries);
      setLoading(false);
    }
    load();
  }, []);

  const handleScan = async () => {
    setScanning(true);
    const result = await fetchAPI('/trust/guardrails/check-input', { method: 'POST', body: JSON.stringify({ text: scanText }) });
    const hasIssues = scanText.toLowerCase().includes('password') || scanText.toLowerCase().includes('ssn') || scanText.toLowerCase().includes('credit card') || scanText.match(/\b\d{3}-\d{2}-\d{4}\b/);
    setScanResult(result || {
      passed: !hasIssues,
      violations: hasIssues ? [{ type: 'pii_detected', severity: 'high', detail: 'Potentially sensitive information detected in input' }] : [],
      checked_at: new Date().toISOString(),
    });
    setScanning(false);
  };

  if (loading) return <Spinner />;

  return (
    <div className="fade-in space-y-6">
      <SectionTitle icon="ti-shield-check" title="Trust & Safety" subtitle="Guardrails, compliance, and audit logging" />

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard icon="ti-checks" label="Checks Passed" value={stats.passed?.toLocaleString()} sub={`of ${stats.total_checks?.toLocaleString()} total`} color="emerald" />
        <StatCard icon="ti-alert-triangle" label="Checks Failed" value={stats.failed?.toLocaleString()} sub={`${((stats.failed / stats.total_checks) * 100).toFixed(1)}% failure rate`} color="red" />
        <StatCard icon="ti-eye" label="PII Detections" value={stats.violation_types?.pii_detected} color="amber" />
        <StatCard icon="ti-shield" label="Prompt Injections" value={stats.violation_types?.prompt_injection} sub="Blocked attempts" color="red" />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-white rounded-xl border border-slate-200 p-5">
          <h3 className="text-sm font-semibold text-slate-900 mb-4 flex items-center gap-2">
            <i className="ti ti-scan text-blue-500"></i> Guardrails Scanner
          </h3>
          <div className="space-y-3">
            <textarea value={scanText} onChange={e => setScanText(e.target.value)} rows={4} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" placeholder="Enter text to scan for violations..." />
            <button onClick={handleScan} disabled={!scanText || scanning} className="w-full px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50 transition">
              {scanning ? 'Scanning...' : 'Scan Text'}
            </button>
          </div>
          {scanResult && (
            <div className={`mt-4 p-4 rounded-lg border ${scanResult.passed ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'}`}>
              <div className="flex items-center gap-2 mb-2">
                <i className={`ti ${scanResult.passed ? 'ti-circle-check text-emerald-600' : 'ti-alert-circle text-red-600'}`}></i>
                <span className={`text-sm font-semibold ${scanResult.passed ? 'text-emerald-700' : 'text-red-700'}`}>
                  {scanResult.passed ? 'No violations detected' : `${scanResult.violations.length} violation(s) found`}
                </span>
              </div>
              {scanResult.violations?.map((v, i) => (
                <div key={i} className="ml-6 mt-2 text-sm text-red-600">
                  <span className="font-medium">{v.type}</span>: {v.detail} <span className="text-xs text-red-400">({v.severity})</span>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="bg-white rounded-xl border border-slate-200 p-5">
          <h3 className="text-sm font-semibold text-slate-900 mb-4 flex items-center gap-2">
            <i className="ti ti-chart-pie text-amber-500"></i> Violation Breakdown
          </h3>
          <div className="space-y-3">
            {Object.entries(stats.violation_types || {}).map(([type, count]) => {
              const total = Object.values(stats.violation_types).reduce((a, b) => a + b, 0);
              const pctVal = ((count / total) * 100).toFixed(0);
              const colors = { pii_detected: 'bg-amber-500', toxic_content: 'bg-red-500', prompt_injection: 'bg-purple-500', off_topic: 'bg-slate-400' };
              return (
                <div key={type}>
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-sm text-slate-600 capitalize">{type.replace(/_/g, ' ')}</span>
                    <span className="text-sm font-semibold text-slate-900">{count} <span className="text-xs text-slate-400">({pctVal}%)</span></span>
                  </div>
                  <div className="w-full bg-slate-100 rounded-full h-2">
                    <div className={`${colors[type] || 'bg-blue-500'} h-2 rounded-full transition-all`} style={{ width: `${pctVal}%` }}></div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div className="px-5 py-4 border-b border-slate-200">
          <h3 className="text-sm font-semibold text-slate-900 flex items-center gap-2">

        </div>
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-slate-50 border-b border-slate-200">
              <th className="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Actor</th>

              <th className="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
              <th className="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Timestamp</th>
            </tr>
          </thead>
          <tbody>
            {entries.map(e => (
              <tr key={e.id} className="border-b border-slate-100 hover:bg-slate-50 transition">
                <td className="px-5 py-3 font-medium text-slate-900">{e.actor}</td>

function KnowledgePage() {
  const [searchStats, setSearchStats] = useState(null);

  const [query, setQuery] = useState('');
  const [results, setResults] = useState(null);

  const [rerankerInput, setRerankerInput] = useState('');
  const [rerankerResult, setRerankerResult] = useState(null);

  useEffect(() => {
    async function load() {
      const [s, e] = await Promise.all([
        fetchAPI('/search/stats'),
        fetchAPI('/graph/entities'),
      ]);
      setSearchStats(s || MOCK.searchStats);
      setEntities(e && Array.isArray(e) ? e : MOCK.graphEntities);
      setLoading(false);
    }
    load();
  }, []);

  const handleSearch = async () => {
    setSearching(true);
    const res = await fetchAPI('/search/query', { method: 'POST', body: JSON.stringify({ query, top_k: 5 }) });
    setResults(res || {
      results: [
        { id: 'doc-001', title: 'API Security Best Practices', score: 0.94, snippet: `Comprehensive guide covering authentication, rate limiting, and input validation for ${query}...` },
        { id: 'doc-002', title: 'Agent Architecture Overview', score: 0.87, snippet: `Overview of the multi-agent architecture and how it relates to ${query}...` },
        { id: 'doc-003', title: 'Cost Optimization Strategies', score: 0.72, snippet: `Strategies for reducing AI inference costs through caching and model selection for ${query}...` },
      ],
      query,
      latency_ms: 38,
    });
    setSearching(false);
  };

  const handleReranker = async () => {
    const res = await fetchAPI('/search/rerank', { method: 'POST', body: JSON.stringify({ query: rerankerInput, documents: ['Doc A', 'Doc B', 'Doc C'] }) });
    setRerankerResult(res || {
      reranked: [
        { document: 'Doc A', original_rank: 1, new_rank: 2, score: 0.78 },
        { document: 'Doc B', original_rank: 2, new_rank: 1, score: 0.92 },
        { document: 'Doc C', original_rank: 3, new_rank: 3, score: 0.45 },

      model: 'cross-encoder/ms-marco-MiniLM-L-6-v2',
    });
  };

  if (loading) return <Spinner />;

  const ss = searchStats || MOCK.searchStats;

  return (
    <div className="fade-in space-y-6">
      <SectionTitle icon="ti-brain" title="Knowledge" subtitle="Semantic search, knowledge graph, and reranking" />

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard icon="ti-search" label="Total Queries" value={ss.total_queries?.toLocaleString()} color="blue" />
        <StatCard icon="ti-clock" label="Avg Latency" value={`${ss.avg_latency_ms}ms`} color="emerald" />
        <StatCard icon="ti-database" label="Index Size" value={ss.index_size?.toLocaleString()} sub="documents" color="purple" />
        <StatCard icon="ti-arrows-sort" label="Reranker" value={ss.reranker_enabled ? 'Enabled' : 'Disabled'} color={ss.reranker_enabled ? 'emerald' : 'slate'} />

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-white rounded-xl border border-slate-200 p-5">
          <h3 className="text-sm font-semibold text-slate-900 mb-4 flex items-center gap-2">
            <i className="ti ti-search text-blue-500"></i> Semantic Search
          </h3>
          <div className="flex gap-2 mb-4">
            <input value={query} onChange={e => setQuery(e.target.value)} onKeyDown={e => e.key === 'Enter' && query && handleSearch()} className="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Search knowledge base..." />
            <button onClick={handleSearch} disabled={!query || searching} className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50 transition">
              {searching ? '...' : 'Search'}

                  <div className="flex items-center justify-between mb-1">
                    <p className="text-sm font-medium text-slate-900">{r.title}</p>
                    <span className="text-xs font-mono text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{(r.score * 100).toFixed(0)}%</span>

        <div className="bg-white rounded-xl border border-slate-200 p-5">
          <h3 className="text-sm font-semibold text-slate-900 mb-4 flex items-center gap-2">
            <i className="ti ti-hierarchy-2 text-purple-500"></i> Knowledge Graph Entities

      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-5">
        <h3 className="text-sm font-semibold text-slate-900 mb-4 flex items-center gap-2">

        {rerankerResult && (

              <thead>
                <tr className="bg-slate-50">
                  <th className="text-left px-4 py-2 text-xs font-semibold text-slate-500">Document</th>

                  <div className="flex items-center gap-2">
                    <p className="text-sm font-medium text-slate-900">{t.name}</p>
                    <span className="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs">{t.category}</span>
                  </div>
                  <p className="text-xs text-slate-500 mt-0.5">{t.description}</p>
                </div>
                <div className="flex items-center gap-3">
                  <span className="text-xs text-slate-500">{t.calls?.toLocaleString()} calls</span>
                  <StatusBadge status={t.status} />
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div className="px-5 py-4 border-b border-slate-200">
            <h3 className="text-sm font-semibold text-slate-900 flex items-center gap-2">
              <i className="ti ti-plug text-emerald-500"></i> Connectors
            </h3>
          </div>
          <div className="divide-y divide-slate-100">
            {connectors.map(c => (
              <div key={c.id} className="px-5 py-3 flex items-center justify-between hover:bg-slate-50 transition">
                <div>
                  <p className="text-sm font-medium text-slate-900">{c.name}</p>
                  <p className="text-xs text-slate-500">Last sync: {fmtTime(c.last_sync)} &middot; {c.events?.toLocaleString()} events</p>
                </div>
                <StatusBadge status={c.status} />
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Main App ───────────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState('overview');
  const [apiOnline, setApiOnline] = useState(null);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  useEffect(() => {
    async function checkHealth() {
      const h = await fetchAPI('/health');
      setApiOnline(!!h);
    }
    checkHealth();
    const interval = setInterval(checkHealth, 30000);
    return () => clearInterval(interval);
  }, []);

  const navItems = [
    { id: 'overview', label: 'Overview', icon: 'ti-dashboard' },
    { id: 'agents', label: 'Agents', icon: 'ti-robot' },
    { id: 'gateway', label: 'AI Gateway', icon: 'ti-bolt' },
    { id: 'trust', label: 'Trust & Safety', icon: 'ti-shield-check' },
    { id: 'finops', label: 'FinOps', icon: 'ti-currency-dollar' },
    { id: 'orchestration', label: 'Orchestration', icon: 'ti-arrows-shuffle' },
    { id: 'knowledge', label: 'Knowledge', icon: 'ti-brain' },
    { id: 'tools', label: 'Tools', icon: 'ti-tool' },
  ];

  const pages = { overview: OverviewPage, agents: AgentsPage, gateway: GatewayPage, trust: TrustPage, finops: FinOpsPage, orchestration: OrchestrationPage, knowledge: KnowledgePage, tools: ToolsPage };
  const PageComponent = pages[view] || OverviewPage;

  return (
    <div className="flex h-screen bg-slate-100 overflow-hidden">
      {mobileMenuOpen && <div className="fixed inset-0 bg-black/50 z-40 lg:hidden" onClick={() => setMobileMenuOpen(false)}></div>}

      <aside className={`fixed lg:static z-50 h-full bg-slate-900 text-white flex flex-col transition-all duration-300 ${sidebarCollapsed ? 'w-16' : 'w-64'} ${mobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
        <div className={`flex items-center gap-3 px-4 h-16 border-b border-slate-800 flex-shrink-0 ${sidebarCollapsed ? 'justify-center' : ''}`}>
          <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center flex-shrink-0">
            <i className="ti ti-flame text-white text-lg"></i>
          </div>
          {!sidebarCollapsed && <span className="text-lg font-bold tracking-tight">SevaForge</span>}
        </div>

        <nav className="flex-1 py-4 overflow-y-auto">
          <div className="space-y-1 px-3">
            {navItems.map(item => (
              <button
                key={item.id}
                onClick={() => { setView(item.id); setMobileMenuOpen(false); }}
                className={`sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                  view === item.id ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'
                } ${sidebarCollapsed ? 'justify-center' : ''}`}
                title={sidebarCollapsed ? item.label : undefined}
              >
                <i className={`ti ${item.icon} text-lg flex-shrink-0`}></i>
                {!sidebarCollapsed && <span>{item.label}</span>}
              </button>
            ))}
          </div>
        </nav>

        <div className={`border-t border-slate-800 px-4 py-3 flex items-center ${sidebarCollapsed ? 'justify-center' : 'justify-between'}`}>
          {!sidebarCollapsed && <span className="text-xs text-slate-500">v1.0.0</span>}
          <button onClick={() => setSidebarCollapsed(!sidebarCollapsed)} className="text-slate-500 hover:text-white transition hidden lg:block">
            <i className={`ti ${sidebarCollapsed ? 'ti-chevron-right' : 'ti-chevron-left'}`}></i>
          </button>
          {!sidebarCollapsed && (
            <button className="text-slate-500 hover:text-white transition">
              <i className="ti ti-settings text-lg"></i>
            </button>
          )}
        </div>
      </aside>

      <div className="flex-1 flex flex-col overflow-hidden">
        <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0">
          <div className="flex items-center gap-4">
            <button onClick={() => setMobileMenuOpen(true)} className="lg:hidden text-slate-500 hover:text-slate-700">
              <i className="ti ti-menu-2 text-xl"></i>
            </button>
            <h1 className="text-lg font-semibold text-slate-900 capitalize">{navItems.find(n => n.id === view)?.label || 'Overview'}</h1>
          </div>
          <div className="flex items-center gap-4">
            <div className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium ${apiOnline === true ? 'bg-emerald-50 text-emerald-700' : apiOnline === false ? 'bg-red-50 text-red-700' : 'bg-slate-100 text-slate-500'}`}>
              <span className={`w-2 h-2 rounded-full ${apiOnline === true ? 'bg-emerald-500 pulse-dot' : apiOnline === false ? 'bg-red-500' : 'bg-slate-400'}`}></span>
              {apiOnline === true ? 'API Online' : apiOnline === false ? 'API Offline' : 'Checking...'}
            </div>
            <div className="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
              <i className="ti ti-user text-blue-600 text-sm"></i>
            </div>
          </div>
        </header>

        {apiOnline === false && (
          <div className="bg-amber-50 border-b border-amber-200 px-6 py-2.5 flex items-center gap-2 flex-shrink-0">
            <i className="ti ti-alert-triangle text-amber-600"></i>
            <span className="text-sm text-amber-700">API is offline. Displaying fallback data. The dashboard will reconnect automatically.</span>
          </div>
        )}

        <main className="flex-1 overflow-y-auto p-6">
          <PageComponent />
        </main>
      </div>
    </div>
  );
}

// ── Render ──────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
