apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-handler
  namespace: sevaforge
  labels:
    app.kubernetes.io/name: webhook-handler
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: sevaforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-handler
      app.kubernetes.io/part-of: sevaforge
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-handler
        app.kubernetes.io/component: webhook
        app.kubernetes.io/part-of: sevaforge
    spec:
      serviceAccountName: sevaforge-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: webhook-handler
                topologyKey: kubernetes.io/hostname
      containers:
        - name: webhook-handler
          image: us-central1-docker.pkg.dev/sevaforge-prod/sevaforge/webhook-handler:latest
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sevaforge-config
            - secretRef:
                name: sevaforge-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-handler
  namespace: sevaforge
  labels:
    app.kubernetes.io/name: webhook-handler
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: sevaforge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webhook-handler
    app.kubernetes.io/part-of: sevaforge
  ports:
    - name: http
      port: 8002
      targetPort: http
      protocol: TCP
