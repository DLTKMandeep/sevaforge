version: '3.9'
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SEVAFORGE_ENVIRONMENT=development
      - SEVAFORGE_DATABASE_URL=postgresql+asyncpg://sevaforge:sevaforge@postgres:5432/sevaforge
      - SEVAFORGE_REDIS_URL=redis://redis:6379/0
      - SEVAFORGE_OTEL_ENABLED=true
      - SEVAFORGE_OTEL_ENDPOINT=http://jaeger:4317
    depends_on:
      - postgres
      - redis
    volumes:
      - ./src:/app/src  # Hot reload
    command: uvicorn sevaforge.api.app:create_app --factory --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sevaforge
      POSTGRES_PASSWORD: sevaforge
      POSTGRES_DB: sevaforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  jaeger:
    image: jaegertracing/all-in-one:1.55
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  dashboard:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
